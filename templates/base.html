<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Copa do Mundo ⚽</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #009739, #FEDD00);
            color: white;
        }

        header{
            background-color: #002776;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 0px 10px black;
        }

        header h1{
            margin: 0;
            font-size: 40px;
        }

        .container{
            width: 80%;
            margin: auto;
            margin-top: 30px;
            background-color: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
        }

        input{
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
        }

        button{
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            margin-right: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add{
            background-color: #00ff88;
        }

        .btn-sort{
            background-color: #ffdf00;
        }

        .btn-reverse{
            background-color: #ff8800;
        }

        .btn-clear{
            background-color: #ff4444;
            color: white;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            color: black;
        }

        th, td{
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: #002776;
            color: white;
        }

        a{
            text-decoration: none;
            color: red;
            font-weight: bold;
        }

        footer{
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <header>

        <h1>⚽ Copa do Mundo ⚽</h1>

        <p>Cadastro de Seleções</p>

    </header>

    <div class="container">

        <form action="/add" method="POST">

            <input
                type="text"
                name="selecao"
                placeholder="Nome da Seleção"
                required
            >

            <input
                type="text"
                name="continente"
                placeholder="Continente"
                required
            >

            <input
                type="text"
                name="titulos"
                placeholder="Quantidade de Títulos"
                required
            >

            <button
                class="btn-add"
                type="submit"
            >
                Adicionar Seleção
            </button>

        </form>

        <br>

        <form action="/sort" method="POST" style="display:inline;">

            <button
                class="btn-sort"
                type="submit"
            >
                Ordenar A-Z
            </button>

        </form>

        <form action="/reverse" method="POST" style="display:inline;">

            <button
                class="btn-reverse"
                type="submit"
            >
                Ordem Reversa
            </button>

        </form>

        <form action="/clear" method="POST" style="display:inline;">

            <button
                class="btn-clear"
                type="submit"
            >
                Limpar Tudo
            </button>

        </form>

        <table>

            <tr>

                <th>Seleção</th>
                <th>Continente</th>
                <th>Títulos</th>
                <th>Excluir</th>

            </tr>

            {% for item in lista_front %}

            <tr>

                <td>{{ item[0] }}</td>

                <td>{{ item[1] }}</td>

                <td>{{ item[2] }}</td>

                <td>

                    <a href="/delete/{{ item[0] }}">
                        ❌
                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

    <footer>

        ⚽ Projeto Flask Copa do Mundo - SENAI ⚽

    </footer>

</body>

</html>
